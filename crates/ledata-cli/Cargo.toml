[package]
name = "ledata-cli"
version = "1.5.0"
description = "LEData 命令行接口（面向 Agent/自动化脚本，共用 ledata-core）"
authors = ["prcxhy"]
edition = "2021"

[[bin]]
name = "ledata-cli"
path = "src/main.rs"

[dependencies]
ledata-core = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
rust_xlsxwriter = "0.99"

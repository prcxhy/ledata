[package]
name = "ledata-py"
version = "1.4.0"
description = "LEData Python 绑定（GUI / Python / CLI 共用 ledata-core）"
authors = ["prcxhy"]
edition = "2021"

[lib]
name = "ledata_py"
crate-type = ["cdylib"]

[build-dependencies]
pyo3-build-config = "0.29"

[dependencies]
ledata-core = { workspace = true }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
numpy = "0.29"
serde_json = { workspace = true }

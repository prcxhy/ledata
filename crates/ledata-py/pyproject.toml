[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "ledata-py"
version = "1.5.0"
description = "LEData Python 绑定：LED 器件测试数据提取（与 GUI 同一 Rust 核心）"
authors = [{ name = "prcxhy" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[tool.maturin]
features = ["pyo3/extension-module"]
include = [{ path = "ledata_py.pyi", format = ["sdist", "wheel"] }]
